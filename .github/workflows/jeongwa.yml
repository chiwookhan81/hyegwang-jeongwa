            console.warn = function () {
              try { if (arguments[0] === 'pose') report('인식기: ' + (arguments[1] && (arguments[1].message || arguments[1]))); } catch (e) { }
              return cw.apply(console, arguments);
            };

            // 3) 크롬 84~98에 새로 생긴 기능을 채워요.
            if (!String.prototype.replaceAll) String.prototype.replaceAll = function (a, b) {
              if (a instanceof RegExp) return this.replace(a, b);
              return this.split(a).join(typeof b === 'function' ? b(a) : b);
            };
            function at(i) { i = Math.trunc(i) || 0; if (i < 0) i += this.length; return (i < 0 || i >= this.length) ? undefined : this[i]; }
            if (!Array.prototype.at) Object.defineProperty(Array.prototype, 'at', { value: at, configurable: true, writable: true });
            if (!String.prototype.at) Object.defineProperty(String.prototype, 'at', { value: at, configurable: true, writable: true });
            if (!Object.hasOwn) Object.hasOwn = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };
            if (!window.structuredClone) window.structuredClone = function (v) { return v === undefined ? v : JSON.parse(JSON.stringify(v)); };
            if (!Promise.any) Promise.any = function (ps) {
              return new Promise(function (res, rej) { var n = 0, errs = []; ps = Array.from(ps); if (!ps.length) rej(new Error('모두 실패'));
                ps.forEach(function (p, i) { Promise.resolve(p).then(res, function (e) { errs[i] = e; if (++n === ps.length) rej(new Error('모두 실패')); }); }); });
            };
          })();
          HGEOF

          mkdir -p "$(dirname 'android/app/src/main/assets/tts-bridge.js')"
          cat > 'android/app/src/main/assets/tts-bridge.js' <<'HGEOF'
          // 혜광전과 앱용 목소리 다리 (스토어 판, 2026-11-20)
          // 웹뷰에서는 브라우저 '컴퓨터 목소리'(speechSynthesis)가 소리가 나지 않거나 기기마다 달라서,
          // 늘 안드로이드 목소리(TTS 엔진)로 읽어요. 앱 밖(크롬 등)에서는 아무 일도 하지 않아요.
          // 웹 표준처럼: 말을 줄 세워 차례대로 읽고, 시작·끝·오류(onstart/onend/onerror)를 알려 줘요.
          // 앱 안의 여러 틀(iframe)이 같은 목소리를 나눠 써요. 소식은 맨 위 틀에서 모든 틀로 전해져요.
          (function () {
            var A = window.AndroidTTS;
            if (!A || typeof A.say !== 'function') return;
            var voices = [{ name: 'Android 한국어', lang: 'ko-KR', default: true, localService: true, voiceURI: 'android-tts' }];
            var tag = 'f' + Math.random().toString(36).slice(2, 8) + '_';
            var seq = 0, live = {}, liveCount = 0;

            function Utterance(text) {
              this.text = text || ''; this.lang = 'ko-KR'; this.voice = null;
              this.rate = 1; this.pitch = 1; this.volume = 1;
              this.onstart = null; this.onend = null; this.onerror = null;
              this.onpause = null; this.onresume = null; this.onboundary = null; this.onmark = null;
              this._ls = {};
            }
            Utterance.prototype.addEventListener = function (t, f) { (this._ls[t] = this._ls[t] || []).push(f); };
            Utterance.prototype.removeEventListener = function (t, f) {
              var l = this._ls[t]; if (!l) return; var i = l.indexOf(f); if (i >= 0) l.splice(i, 1);
            };
            function fire(u, type, extra) {
              var ev = { type: type, target: u, utterance: u, charIndex: 0, elapsedTime: 0, name: '' };
              if (extra) for (var k in extra) ev[k] = extra[k];
              try { if (typeof u['on' + type] === 'function') u['on' + type](ev); } catch (e) { setTimeout(function () { throw e; }); }
              var l = (u._ls && u._ls[type]) ? u._ls[type].slice() : [];
              for (var i = 0; i < l.length; i++) { try { l[i](ev); } catch (e2) { } }
            }
            function finish(id, type, extra) {
              var u = live[id]; if (!u) return;
              delete live[id]; liveCount--;
              synth.speaking = liveCount > 0; synth.pending = liveCount > 1;
              fire(u, type, extra);
            }

            var synth = {
              speaking: false, pending: false, paused: false, onvoiceschanged: null,
              getVoices: function () { return voices; },
              speak: function (u) {
                if (!u) return;
                var id = tag + (++seq);
                live[id] = u; liveCount++;
                synth.pending = liveCount > 1;
                var v = (u.volume == null) ? 1 : Number(u.volume);
                try {
                  A.say(id, String(u.text || ''), Number(u.rate) || 1, Number(u.pitch) || 1, isNaN(v) ? 1 : v);
                } catch (e) {
                  setTimeout(function () { finish(id, 'error', { error: 'synthesis-unavailable' }); }, 0);
                }
              },
              // 먼저 소리를 멈추고, 이 틀에서 읽던·기다리던 말에 '끊김'을 알려요. (곧바로 새 말을 해도 그 말은 살아 있어요)
              cancel: function () {
                try { A.stop(); } catch (e) { }
                cancelHere();
              },
              pause: function () { }, resume: function () { },
              addEventListener: function (t, f) { if (t === 'voiceschanged') synth.onvoiceschanged = f; },
              removeEventListener: function () { },
              dispatchEvent: function () { return true; }
            };

            function cancelHere() {
              var ids = Object.keys(live);
              for (var i = 0; i < ids.length; i++) finish(ids[i], 'error', { error: 'interrupted' });
            }

            // 안드로이드가 알려 주는 소식: 이 틀 것이면 처리하고, 아래 틀들에도 전해요.
            window.__hgTts = function (type, id) {
              if (id && id.indexOf(tag) === 0) {
                if (type === 'start') { synth.speaking = true; if (live[id]) fire(live[id], 'start'); }
                else if (type === 'end') finish(id, 'end');
                else finish(id, 'error', { error: 'synthesis-failed' });
              }
              var fr = window.frames;
              for (var i = 0; i < fr.length; i++) {
                try { if (fr[i].__hgTts) fr[i].__hgTts(type, id); } catch (e) { }
              }
            };

            try {
              Object.defineProperty(window, 'speechSynthesis', { value: synth, configurable: true, writable: true });
              Object.defineProperty(window, 'SpeechSynthesisUtterance', { value: Utterance, configurable: true, writable: true });
            } catch (e) {
