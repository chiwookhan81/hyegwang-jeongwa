          cat > 'android/app/src/main/assets/tts-bridge.js' <<'HGEOF'
          // 혜광전과 앱용 목소리 다리 (스토어 판, 2026-11-20)
          // 웹뷰에서는 브라우저 '컴퓨터 목소리'(speechSynthesis)가 소리가 나지 않거나 기기마다 달라서,
          // 늘 안드로이드 목소리(TTS 엔진)로 읽어요. 앱 밖(크롬 등)에서는 아무 일도 하지 않아요.
          // 웹 표준처럼: 말을 줄 세워 차례대로 읽고, 시작·끝·오류(onstart/onend/onerror)를 알려 줘요.
          // 앱 안의 여러 틀(iframe)이 같은 목소리를 나눠 써요. 소식은 맨 위 틀에서 모든 틀로 전해져요.
          (function () {
