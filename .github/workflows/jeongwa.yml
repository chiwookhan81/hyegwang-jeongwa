          cat > 'android/app/src/main/assets/compat.js' <<'HGEOF'
          // 혜광전과 앱용: 오래된 웹 엔진(칠판의 크롬 83 등)에서도 돌아가게 빈 기능을 채워 줘요.
          (function () {
            // 1) 둥근 네모 그리기(roundRect)는 크롬 99부터 있어요. 없으면 직접 그려 줘요.
            var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
            function rr(x, y, w, h, r) {
              if (r == null) r = 0;
              if (typeof r === 'object' && r.length != null) r = r.length ? r[0] : 0;
              if (typeof r === 'object' && r && 'x' in r) r = r.x;
              r = Math.max(0, Math.min(+r || 0, Math.abs(w) / 2, Math.abs(h) / 2));
              this.moveTo(x + r, y);
              this.lineTo(x + w - r, y);
              this.arcTo(x + w, y, x + w, y + r, r);
              this.lineTo(x + w, y + h - r);
              this.arcTo(x + w, y + h, x + w - r, y + h, r);
              this.lineTo(x + r, y + h);
              this.arcTo(x, y + h, x, y + h - r, r);
              this.lineTo(x, y + r);
              this.arcTo(x, y, x + r, y, r);
              this.closePath();
              return this;
            }
            if (P && !P.roundRect) P.roundRect = rr;
            if (window.Path2D && !Path2D.prototype.roundRect) Path2D.prototype.roundRect = rr;
            if (window.OffscreenCanvasRenderingContext2D && !OffscreenCanvasRenderingContext2D.prototype.roundRect)
              OffscreenCanvasRenderingContext2D.prototype.roundRect = rr;

            // 2) 시험판: 오류가 나면 화면 아래에 작게 띄워요. (누르면 사라져요)
            var box = null, shown = 0;
            function report(msg) {
              if (shown >= 5) return; shown++;
              try {
                if (!box) {
                  box = document.createElement('div');
                  box.style.cssText = 'position:fixed;left:8px;bottom:8px;max-width:70%;z-index:2147483647;' +
                    'background:rgba(180,20,40,.92);color:#fff;font:14px/1.4 sans-serif;padding:8px 12px;border-radius:10px;white-space:pre-wrap';
                  box.onclick = function () { box.style.display = 'none'; };
                  (document.body || document.documentElement).appendChild(box);
                }
                box.style.display = 'block';
                box.textContent = (box.textContent ? box.textContent + '\n' : '오류 (사진 찍어 보내 주세요):\n') + String(msg).slice(0, 200);
              } catch (e) { }
            }
            window.addEventListener('error', function (e) {
              report((e.message || '오류') + (e.lineno ? ' @' + e.lineno : ''));
            });
            window.addEventListener('unhandledrejection', function (e) {
              var r = e.reason; report('약속 오류: ' + (r && (r.message || r)) );
            });
            var cw = console.warn;
            console.warn = function () {
              try { if (arguments[0] === 'pose') report('인식기: ' + (arguments[1] && (arguments[1].message || arguments[1]))); } catch (e) { }
              return cw.apply(console, arguments);
            };

            // 3) 크롬 84~98에 새로 생긴 기능을 채워요.
            if (!String.prototype.replaceAll) String.prototype.replaceAll = function (a, b) {
              if (a instanceof RegExp) return this.replace(a, b);
              return this.split(a).join(typeof b === 'function' ? b(a) : b);
            };
            function at(i) { i = Math.trunc(i) || 0; if (i < 0) i += this.length; return (i < 0 || i >= this.length) ? undefined : this[i]; }
            if (!Array.prototype.at) Object.defineProperty(Array.prototype, 'at', { value: at, configurable: true, writable: true });
            if (!String.prototype.at) Object.defineProperty(String.prototype, 'at', { value: at, configurable: true, writable: true });
            if (!Object.hasOwn) Object.hasOwn = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };
            if (!window.structuredClone) window.structuredClone = function (v) { return v === undefined ? v : JSON.parse(JSON.stringify(v)); };
            if (!Promise.any) Promise.any = function (ps) {
              return new Promise(function (res, rej) { var n = 0, errs = []; ps = Array.from(ps); if (!ps.length) rej(new Error('모두 실패'));
                ps.forEach(function (p, i) { Promise.resolve(p).then(res, function (e) { errs[i] = e; if (++n === ps.length) rej(new Error('모두 실패')); }); }); });
            };
          })();
          HGEOF

