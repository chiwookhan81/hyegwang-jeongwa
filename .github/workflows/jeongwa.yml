      - name: APK 만들기
        if: steps.chg.outputs.apk == '1'
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK 올리기 (내려받기 칸 apk)
        if: steps.chg.outputs.apk == '1'
        shell: bash
        run: |
          set -e
          cp android/app/build/outputs/apk/release/app-release.apk hyegwang-jeongwa.apk
          gh release delete apk -y --cleanup-tag >/dev/null 2>&1 || true
          sleep 3
          gh release create apk hyegwang-jeongwa.apk --title "혜광전과 안드로이드 앱" --latest \
            --notes "전자칠판·태블릿에 까는 혜광전과 앱이에요. (만든 번호 ${{ github.run_number }}) 앱 내용은 켤 때 저절로 새 판을 받아요."
