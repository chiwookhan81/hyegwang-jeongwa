          mkdir -p "$(dirname 'android/app/src/main/assets/compat.js')"
          cat > 'android/app/src/main/assets/compat.js' <<'HGEOF'
          // 혜광전과 앱용: 오래된 웹 엔진(칠판의 크롬 83 등)에서도 돌아가게 빈 기능을 채워 줘요.
          (function () {
            // 1) 둥근 네모 그리기(roundRect)는 크롬 99부터 있어요. 없으면 직접 그려 줘요.
            var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
            function rr(x, y, w, h, r) {
              if (r == null) r = 0;
              if (typeof r === 'object' && r.length != null) r = r.length ? r[0] : 0;
              if (typeof r === 'object' && r && 'x' in r) r = r.x;
              r = Math.max(0, Math.min(+r || 0, Math.abs(w) / 2, Math.abs(h) / 2));
              this.moveTo(x + r, y);
              this.lineTo(x + w - r, y);
              this.arcTo(x + w, y, x + w, y + r, r);
              this.lineTo(x + w, y + h - r);
              this.arcTo(x + w, y + h, x + w - r, y + h, r);
              this.lineTo(x + r, y + h);
              this.arcTo(x, y + h, x, y + h - r, r);
              this.lineTo(x, y + r);
              this.arcTo(x, y, x + r, y, r);
              this.closePath();
              return this;
            }
            if (P && !P.roundRect) P.roundRect = rr;
            if (window.Path2D && !Path2D.prototype.roundRect) Path2D.prototype.roundRect = rr;
            if (window.OffscreenCanvasRenderingContext2D && !OffscreenCanvasRenderingContext2D.prototype.roundRect)
              OffscreenCanvasRenderingContext2D.prototype.roundRect = rr;

