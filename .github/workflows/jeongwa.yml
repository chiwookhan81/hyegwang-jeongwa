              window.SpeechSynthesisUtterance = Utterance;
            }
            // 목소리 목록을 기다리는 앱을 위해 한 번 알려 줘요.
            setTimeout(function () {
              try { if (typeof synth.onvoiceschanged === 'function') synth.onvoiceschanged({ type: 'voiceschanged' }); } catch (e) { }
            }, 0);
          })();
