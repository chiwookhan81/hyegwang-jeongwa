          <!DOCTYPE html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>초승달 전과</title>
          <style>
            html, body { margin: 0; height: 100%; background: #fdf6ea; font-family: 'Malgun Gothic', sans-serif; color: #4a3428; }
            .wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
            h1 { font-size: 64px; margin: 0 0 6px; color: #b45309; letter-spacing: 4px; text-shadow: 0 3px 0 #fde68a; }
            #msg { font-size: 28px; margin: 18px 0 10px; text-align: center; }
            #sub { font-size: 20px; color: #8a6d5a; min-height: 28px; text-align: center; }
            .bar { width: 70%; max-width: 760px; height: 34px; background: #fff; border: 4px solid #4a3428; border-radius: 99px; overflow: hidden; margin-top: 10px; display: none; }
            .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #fbbf24, #f97316); transition: width .2s; }
            #notes { display: none; width: 80%; max-width: 860px; max-height: 45vh; overflow: auto; background: #fff; border: 4px solid #4a3428; border-radius: 22px; padding: 16px 22px; margin-top: 18px; font-size: 20px; line-height: 1.6; white-space: pre-wrap; box-sizing: border-box; }
            #notes b { display: block; font-size: 26px; margin-bottom: 6px; color: #b45309; }
            .btn { display: none; margin-top: 22px; font-size: 32px; padding: 14px 54px; border: 4px solid #4a3428; border-radius: 99px; background: #fbbf24; color: #4a3428; box-shadow: 0 6px 0 #4a3428; font-family: inherit; }
            .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #4a3428; }
            #shell { display: none; margin-top: 14px; font-size: 18px; background: #fee2e2; border: 3px solid #b91c1c; border-radius: 14px; padding: 10px 16px; max-width: 80%; text-align: center; }
          </style>
          </head>
          <body>
          <div class="wrap">
            <h1>초승달 전과</h1>
            <div id="msg">새 판이 있는지 보고 있어요…</div>
            <div class="bar" id="bar"><i id="fill"></i></div>
            <div id="sub"></div>
            <div id="notes"><b>새로 바뀐 점</b><span id="ntext"></span></div>
            <div id="shell">앱 껍데기가 새로 나왔어요. 선생님께 새 앱을 깔아 달라고 말씀드려 주세요.</div>
            <button class="btn" id="go" onclick="upd.go()">시작하기</button>
          </div>
          <script>
          var upd = {
            started: false,
            $: function (id) { return document.getElementById(id); },
            begin: function (total, count) {
              this.$('msg').textContent = '업데이트 받는 중  0%';
              this.$('bar').style.display = 'block';
              this.$('sub').textContent = '바뀐 파일 ' + count + '개 · ' + (total / 1048576).toFixed(1) + 'MB';
            },
            progress: function (done, total, name) {
              var p = total ? Math.min(100, Math.floor(done * 100 / total)) : 0;
              this.$('fill').style.width = p + '%';
              this.$('msg').textContent = '업데이트 받는 중  ' + p + '%';
            },
            ready: function (updated, notes, offline) {
              var self = this;
              if (updated) {
                this.$('fill').style.width = '100%';
                this.$('msg').textContent = offline ? '일부만 받았어요. 다음에 켤 때 나머지를 받아요.' : '업데이트를 다 받았어요!';
                this.$('sub').textContent = '';
                if (notes) { this.$('ntext').textContent = notes; this.$('notes').style.display = 'block'; }
                this.$('go').style.display = 'inline-block';
                return;
              }
              this.$('msg').textContent = offline ? '인터넷이 없어서 지난번 판으로 열어요.' : '가장 새 판이에요.';
              setTimeout(function () { self.go(); }, offline ? 1500 : 400);
            },
            fail: function (text) {
              this.$('msg').textContent = text;
              this.$('sub').textContent = '';
              this.$('go').textContent = '다시 해 보기';
              this.$('go').onclick = function () { location.reload(); };
              this.$('go').style.display = 'inline-block';
            },
            shellNotice: function () { this.$('shell').style.display = 'block'; },
            go: function () { if (window.Updater) Updater.open(); }
          };
          window.onload = function () {
            if (window.Updater) Updater.start();
            else upd.fail('안드로이드 앱 안에서만 열려요.');
          };
          </script>
          </body>
          </html>
