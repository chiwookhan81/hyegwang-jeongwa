name: 초승달 전과 앱 만들기

# 혜광전과 안드로이드 앱 순서표예요. 이 파일 하나에 앱 껍데기와 바꾸는 도구가 다 들어 있어요.
# - 앱 내용(index.html, notes.txt, apps 폴더)을 올리면: 칠판 엔진(크롬 83)용으로 바꿔서 '내려받기 칸(content)'에 올려요.
#   칠판의 앱은 켤 때 바뀐 파일만 내려받아요. (앱을 다시 깔 필요 없어요)
# - 이 순서표를 바꾸면: 플레이스토어에 올릴 앱 껍데기(AAB)를 새로 만들어 '내려받기 칸(store)'에 올려요.
#   (2026-11-20부터 스토어 판. 칠판에 직접 까는 APK 판은 더 만들지 않아요)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeongwa
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HG_KEYSTORE: ${{ secrets.HG_KEYSTORE }}
      HG_KEY_PASSWORD: ${{ secrets.HG_KEY_PASSWORD }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 무엇을 만들지 정하기
        id: chg
        shell: bash
        run: |
          set +e
          C=0; K=0
          B="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$B" ] || [ "$B" = "0000000000000000000000000000000000000000" ]; then
            C=1; K=1
          else
            F=$(git diff --name-only "$B" "${{ github.sha }}")
            echo "$F"
            echo "$F" | grep -qv '^\.github/' && C=1
            echo "$F" | grep -q '^\.github/workflows/' && K=1
          fi
          gh release view content >/dev/null 2>&1 || C=1
          gh release view store >/dev/null 2>&1 || K=1
          [ -f index.html ] || C=0
          echo "content=$C" >> "$GITHUB_OUTPUT"; echo "apk=$K" >> "$GITHUB_OUTPUT"
          echo "내용 만들기=$C, 앱 껍데기 만들기=$K"

      # ───────── 앱 내용 ─────────
      - name: 바꾸는 도구 받기 (esbuild, SIMD 없는 몸 인식기)
        if: steps.chg.outputs.content == '1'
        shell: bash
        run: |
          set -e
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/tools" esbuild@0.24.0 @mediapipe/tasks-vision@0.10.14

      - name: 앱 내용 바꾸기 (크롬 83용)
        if: steps.chg.outputs.content == '1'
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname 'tools/prepare_content.py')"
          cat > 'tools/prepare_content.py' <<'HGEOF'
          # 혜광전과 안드로이드 앱 내용 준비 (GitHub가 돌려요)
          #   python3 prepare_content.py <저장소폴더> <결과폴더> <esbuild> <tasks-vision폴더> <만든번호>
          # 1) 조각(.part01…)을 이어 붙여요.
          # 2) 칠판 웹 엔진(크롬 83)이 못 읽는 새 문법을 옛 문법으로 바꿔요. (원본 html은 바꾸지 않아요)
          # 3) 혜광goat 몸 인식기는 SIMD 없는 것으로 갈아 끼워요.
          # 4) 파일마다 지문(sha256)을 적은 version.json을 만들어요. 앱은 지문이 바뀐 파일만 내려받아요.
          import base64, gzip, hashlib, json, pathlib, re, subprocess, sys

          src, dst, esbuild, mpdir, run = sys.argv[1:6]
          src = pathlib.Path(src); dst = pathlib.Path(dst); mpdir = pathlib.Path(mpdir)
          dst.mkdir(parents=True, exist_ok=True)
          T = 'chrome83'
          SHELL = 1   # 앱 껍데기를 새로 깔아야 할 만큼 바뀌면 이 숫자를 올려요
          CDN = 'https://appassets.androidplatform.net/assets/'


          def esb(code, loader, extra=()):
              r = subprocess.run([esbuild, '--loader=' + loader, '--target=' + T, '--log-level=error', '--charset=utf8', *extra],
                                 input=code.encode('utf-8'), capture_output=True)
              if r.returncode:
                  raise RuntimeError(r.stderr.decode('utf-8', 'replace')[:1500])
              return r.stdout.decode('utf-8')


          def convert(html, name):
              # CSS
              def css(m):
                  try:
                      return m.group(1) + esb(m.group(2), 'css') + m.group(3)
                  except RuntimeError as e:
                      print('  CSS 그대로 둠:', name, str(e)[:200]); return m.group(0)
              html = re.sub(r'(<style[^>]*>)(.*?)(</style>)', css, html, flags=re.S)

              # 일반 script (데이터 칸 text/plain 등은 그대로)
              def js(m):
                  attrs, body = m.group(1), m.group(2)
                  if ('type=' in attrs and 'javascript' not in attrs and 'module' not in attrs) or not body.strip():
                      return m.group(0)
                  try:
                      return '<script' + attrs + '>' + esb(body, 'js', ['--format=esm'] if 'module' in attrs else []) + '</script>'
                  except RuntimeError as e:
                      print('  JS 그대로 둠:', name, str(e)[:200]); return m.group(0)
              html = re.sub(r'<script([^>]*)>(.*?)</script>', js, html, flags=re.S)

              # 글자로 적어 둔 inset:0 (프로그램 속 style 문자열) → 옛 방식
              html = re.sub(r'(?<![\w-])inset\s*:\s*0(?:px)?(?=\s*[;"\'`}])', 'top:0;right:0;bottom:0;left:0', html)

              # 혜광goat 몸 인식기 (SIMD 없는 wasm으로)
              if 'id="mp_b"' in html:
                  def pack(b): return base64.b64encode(gzip.compress(b, 9)).decode()
                  def get(id_):
                      m = re.search(r'<script[^>]*id="' + id_ + r'"[^>]*>\s*([A-Za-z0-9+/=\s]+)</script>', html)
                      return gzip.decompress(base64.b64decode(m.group(1)))
                  def swap(id_, txt):
                      nonlocal html
                      pat = re.compile(r'(<script[^>]*id="' + id_ + r'"[^>]*>)\s*[A-Za-z0-9+/=\s]+(</script>)')
                      html = pat.sub(lambda m: m.group(1) + txt + m.group(2), html, count=1)
                  swap('mp_b', pack(esb(get('mp_b').decode('utf-8'), 'js', ['--format=esm']).encode('utf-8')))
                  w = mpdir / 'wasm'
                  if not (w / 'vision_wasm_nosimd_internal.wasm').exists():
                      sys.exit('SIMD 없는 몸 인식기를 찾지 못했어요: ' + str(w))
                  swap('mp_l', pack(esb((w / 'vision_wasm_nosimd_internal.js').read_text(encoding='utf-8'), 'js').encode('utf-8')))
                  swap('mp_w', pack((w / 'vision_wasm_nosimd_internal.wasm').read_bytes()))
                  print('  몸 인식기 바꿈')

              # 옛 엔진 보충 + 안드로이드 목소리 연결을 맨 앞에
              m = re.search(r'<head[^>]*>', html, re.I)
              tag = f'<script src="{CDN}compat.js"></script><script src="{CDN}tts-bridge.js"></script>'
              # 크롬 83은 aspect-ratio(가로세로 비율)를 몰라서, 비율을 대신 맞춰 주는 짧은 코드를 넣어요
              tag += '<script>' + base64.b64decode('').decode('utf-8') + '</script>'
              html = (html[:m.end()] + tag + html[m.end():]) if m else tag + html
              return html


          # 1) 모으기
          files = {}
          for p in sorted(src.rglob('*.html')) + sorted(src.rglob('*.part01')):
              rel = p.relative_to(src).as_posix()
              if rel.startswith(('.', 'tools/', 'android/')):
                  continue
              if rel.endswith('.part01'):
                  base = rel[:-len('.part01')]
                  parts = sorted(p.parent.glob(p.name[:-2] + '[0-9][0-9]'))
                  files[base] = b''.join(x.read_bytes() for x in parts)
                  print('조각 이음:', base, len(parts), '개')
              else:
                  files[rel] = p.read_bytes()

          # 2) 바꾸기 + 3) 지문
          ver = {'build': int(run), 'shell': SHELL, 'files': {}, 'notes': ''}
          notes = src / 'notes.txt'
          if notes.exists():
              ver['notes'] = notes.read_text(encoding='utf-8')
          for rel, b in files.items():
              print('바꾸는 중:', rel, len(b))
              out = convert(b.decode('utf-8'), rel).encode('utf-8')
              asset = rel.replace('/', '--')
              (dst / asset).write_bytes(out)
              ver['files'][rel] = {'asset': asset, 'sha': hashlib.sha256(out).hexdigest(), 'size': len(out)}
          (dst / 'version.json').write_text(json.dumps(ver, ensure_ascii=False, indent=1), encoding='utf-8')
          print('파일', len(ver['files']), '개, 합계', sum(v['size'] for v in ver['files'].values()), 'bytes')
          HGEOF
          python3 tools/prepare_content.py . "$RUNNER_TEMP/out" "$RUNNER_TEMP/tools/node_modules/.bin/esbuild" \
            "$RUNNER_TEMP/tools/node_modules/@mediapipe/tasks-vision" "${{ github.run_number }}"

      - name: 앱 내용 올리기 (내려받기 칸 content)
        if: steps.chg.outputs.content == '1'
        shell: bash
        run: |
          set -e
          gh release delete content -y --cleanup-tag >/dev/null 2>&1 || true
          sleep 3
          gh release create content "$RUNNER_TEMP"/out/* --title "초승달 전과 앱 내용 (만든 번호 ${{ github.run_number }})" \
            --notes "칠판 앱이 켤 때 여기서 바뀐 파일만 받아 가요. 직접 내려받을 필요는 없어요." --latest=false

      # ───────── 앱 껍데기 (APK) ─────────
      - name: 자바 준비
        if: steps.chg.outputs.apk == '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 그래들 준비
        if: steps.chg.outputs.apk == '1'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 앱 껍데기 파일 펼치기
        if: steps.chg.outputs.apk == '1'
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname 'android/settings.gradle')"
          cat > 'android/settings.gradle' <<'HGEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "hyegwang-jeongwa-android"
          include ':app'
          HGEOF

          mkdir -p "$(dirname 'android/build.gradle')"
          cat > 'android/build.gradle' <<'HGEOF'
          plugins {
              id 'com.android.application' version '8.10.1' apply false
          }
          HGEOF

          mkdir -p "$(dirname 'android/gradle.properties')"
          cat > 'android/gradle.properties' <<'HGEOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          HGEOF

          mkdir -p "$(dirname 'android/app/build.gradle')"
          cat > 'android/app/build.gradle' <<'HGEOF'
          plugins {
              id 'com.android.application'
          }

          // 스토어에 올릴 때마다 번호(versionCode)가 올라가야 해요. GitHub에서 만들 때마다 1씩 올라가요.
          def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
          // 선생님들께 보이는 버전 이름이에요. 패치할 때 1.02, 1.05, 1.1 처럼 이 숫자만 바꾸면 돼요.
          def appVersion = '1.0'

          android {
              namespace 'io.github.chiwookhan81.hyegwangjeongwa'
              compileSdk 36

              defaultConfig {
                  applicationId 'io.github.chiwookhan81.hyegwangjeongwa'
                  minSdk 24
                  targetSdk 36
                  versionCode 1000 + runNumber
                  versionName appVersion
              }

              // 서명 열쇠는 GitHub 비밀 칸(HG_KEYSTORE, HG_KEY_PASSWORD)에서 꺼내 써요. 순서표에는 없어요.
              signingConfigs {
                  rel {
                      storeFile file('../signing/release.keystore')
                      storePassword System.getenv('HG_KEY_PASSWORD')
                      keyAlias 'hyegwang'
                      keyPassword System.getenv('HG_KEY_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.rel
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.14.0'
          }
          HGEOF

          mkdir -p "$(dirname 'android/app/src/main/AndroidManifest.xml')"
          cat > 'android/app/src/main/AndroidManifest.xml' <<'HGEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- 새 판(앱 내용)을 GitHub에서 받아 오려고 인터넷을 써요. 학생 정보는 보내지 않아요. -->
              <uses-permission android:name="android.permission.INTERNET" />
              <!-- 혜광goat '움직여 봐요'에서 몸의 움직임을 알아보려고 카메라를 써요. 영상은 저장하거나 보내지 않아요. -->
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.front" android:required="false" />

              <!-- 기기의 한국어 목소리(TTS)를 쓰려면 적어 둬야 해요. -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:largeHeap="true"
                  android:enableOnBackInvokedCallback="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          HGEOF

          mkdir -p "$(dirname 'android/app/src/main/java/io/github/chiwookhan81/hyegwangjeongwa/MainActivity.java')"
          cat > 'android/app/src/main/java/io/github/chiwookhan81/hyegwangjeongwa/MainActivity.java' <<'HGEOF'
          package io.github.chiwookhan81.hyegwangjeongwa;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.window.OnBackInvokedDispatcher;
          import android.widget.FrameLayout;
          import android.graphics.Color;
          import android.view.View;
          import android.view.WindowInsets;
          import android.graphics.Insets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.webkit.WebViewAssetLoader;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Locale;

          /**
           * 혜광전과 안드로이드 앱 (껍데기).
           * - 앱 19개(내용)는 GitHub '내려받기 칸(content)'에서 받아 기기에 저장해 둬요.
           * - 켤 때마다 version.json을 보고, 지문이 바뀐 파일만 새로 받아요. (게임 업데이트처럼)
           * - 인터넷이 없으면 마지막으로 받은 판으로 열려요.
           * - 카메라 권한은 브라우저가 아니라 앱이 직접 받아요. (혜광goat '움직여 봐요')
           */
          public class MainActivity extends Activity {

              // 내용을 받아 오는 곳 (GitHub 저장소의 내려받기 칸)
              private static final String BASE = "https://github.com/chiwookhan81/hyegwang-jeongwa/releases/download/content/";
              // 껍데기 판 번호. 껍데기를 새로 깔아야 할 만큼 바뀌면 version.json의 shell과 함께 올려요.
              private static final int SHELL = 1;

              private static final String HOST = "appassets.androidplatform.net";
              private static final String UPDATER_URL = "https://" + HOST + "/assets/updater.html";
              private static final String CONTENT_URL = "https://" + HOST + "/content/index.html";
              private static final int REQ_CAMERA = 7;
              private static final int REQ_FILE = 8;

              private WebView web;
              private File contentDir;
              private PermissionRequest pendingRequest;
              private ValueCallback<Uri[]> fileCallback;
              private TextToSpeech tts;
              private volatile boolean ttsReady = false;
              // 0: 준비 중, 1: 됨, -1: 안 됨(한국어 목소리 없음 등)
              private volatile int ttsState = 0;
              private final List<String[]> ttsWaiting = new ArrayList<>();
              private boolean ttsWarned = false;
              private volatile boolean busy = false;
              private long lastBack = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); // 수업 중 화면이 꺼지지 않게

                  contentDir = new File(getFilesDir(), "content");
                  contentDir.mkdirs();

                  web = new WebView(this);
                  // 웹뷰를 틀(FrameLayout)에 담아요. 안드로이드 15 이상은 화면 끝까지 그려서,
                  // 카메라 구멍(노치)에 내용이 가리지 않게 틀에 그만큼 여백을 줘요.
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);
                  root.addView(web, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  setContentView(root);
                  if (Build.VERSION.SDK_INT >= 30) {
                      root.setOnApplyWindowInsetsListener((v, insets) -> {
                          Insets i = insets.getInsets(WindowInsets.Type.displayCutout() | WindowInsets.Type.systemBars());
                          v.setPadding(i.left, i.top, i.right, i.bottom);
                          return WindowInsets.CONSUMED;
                      });
                  }
                  // 안드로이드 13 이상 뒤로 가기 (16부터는 이 방법만 돼요)
                  if (Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(
                              OnBackInvokedDispatcher.PRIORITY_DEFAULT, this::backPressed);
                  }

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);                 // 이름·진도 저장(localStorage)
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false); // 시작 음악·목소리·카메라 영상이 바로 나오게
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setTextZoom(100);                           // 기기 글자 크기 설정에 화면이 깨지지 않게

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .setDomain(HOST)
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .addPathHandler("/content/", new WebViewAssetLoader.InternalStoragePathHandler(this, contentDir))
                          .build();

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) { }
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> handlePermission(request));
                      }

                      @Override
                      public void onPermissionRequestCanceled(PermissionRequest request) {
                          if (pendingRequest == request) pendingRequest = null;
                      }

                      // 사진 올리기·파일 불러오기 (아리의 미술관, 혜광크래프트 등)
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = cb;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.addJavascriptInterface(new TtsBridge(), "AndroidTTS");
                  web.addJavascriptInterface(new Updater(), "Updater");
                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          int r = tts.setLanguage(Locale.KOREAN);
                          ttsReady = r != TextToSpeech.LANG_MISSING_DATA && r != TextToSpeech.LANG_NOT_SUPPORTED;
                      }
                      if (ttsReady) {
                          tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                              @Override public void onStart(String id) { ttsEvent("start", id); }
                              @Override public void onDone(String id) { ttsEvent("end", id); }
                              @Override public void onError(String id) { ttsEvent("error", id); }
                              @Override public void onStop(String id, boolean interrupted) { ttsEvent("error", id); }
                          });
                      }
                      ttsState = ttsReady ? 1 : -1;
                      List<String[]> w;
                      synchronized (ttsWaiting) { w = new ArrayList<>(ttsWaiting); ttsWaiting.clear(); }
                      for (String[] a : w) {
                          if (ttsReady) ttsSpeakNow(a);
                          else ttsEvent("error", a[0]);
                      }
                      if (!ttsReady) runOnUiThread(this::ttsWarn);
                  });

                  web.loadUrl(UPDATER_URL);
              }

              // ───────────── 업데이트 ─────────────

              private void js(final String code) {
                  web.post(() -> web.evaluateJavascript(code, null));
              }

              private static String q(String s) { return JSONObject.quote(s == null ? "" : s); }

              private class Updater {
                  @JavascriptInterface
                  public void start() {
                      if (busy) return;
                      busy = true;
                      new Thread(MainActivity.this::runUpdate).start();
                  }

                  @JavascriptInterface
                  public void open() {
                      web.post(() -> web.loadUrl(CONTENT_URL));
                  }

                  @JavascriptInterface
                  public int shell() { return SHELL; }
              }

              private void runUpdate() {
                  try {
                      JSONObject local = readJson(new File(contentDir, "version.json"));
                      boolean haveLocal = local != null && new File(contentDir, "index.html").exists();
                      JSONObject remote = null;
                      try {
                          remote = new JSONObject(new String(get(BASE + "version.json", 8000, 20000), StandardCharsets.UTF_8));
                      } catch (Exception e) {
                          remote = null;
                      }
                      if (remote == null) {
                          if (haveLocal) js("upd.ready(false,'',true)");
                          else js("upd.fail('처음 한 번은 인터넷이 필요해요. 와이파이를 켜고 앱을 다시 열어 주세요.')");
                          return;
                      }
                      if (remote.optInt("shell", 1) > SHELL) js("upd.shellNotice()");

                      JSONObject rf = remote.getJSONObject("files");
                      JSONObject lf = (local != null && local.has("files")) ? local.getJSONObject("files") : new JSONObject();
                      List<String> need = new ArrayList<>();
                      long total = 0;
                      for (Iterator<String> it = rf.keys(); it.hasNext(); ) {
                          String rel = it.next();
                          JSONObject r = rf.getJSONObject(rel);
                          JSONObject l = lf.optJSONObject(rel);
                          File f = new File(contentDir, rel);
                          if (l == null || !r.getString("sha").equals(l.optString("sha")) || !f.exists() || f.length() != r.optLong("size")) {
                              need.add(rel);
                              total += r.optLong("size");
                          }
                      }
                      if (need.isEmpty()) {
                          js("upd.ready(false,'',false)");
                          return;
                      }
                      js("upd.begin(" + total + "," + need.size() + ")");
                      long done = 0;
                      int fails = 0;
                      for (String rel : need) {
                          JSONObject r = rf.getJSONObject(rel);
                          File dst = new File(contentDir, rel);
                          boolean ok = false;
                          for (int tryNo = 0; tryNo < 2 && !ok; tryNo++) {
                              ok = download(BASE + r.getString("asset"), dst, r.getString("sha"), done, total, rel);
                          }
                          if (ok) {
                              lf.put(rel, r);
                              JSONObject save = new JSONObject();
                              save.put("build", remote.optInt("build"));
                              save.put("files", lf);
                              writeText(new File(contentDir, "version.json"), save.toString());
                          } else {
                              fails++;
                          }
                          done += r.optLong("size");
                      }
                      // 이제 쓰지 않는 파일은 지워요
                      List<String> gone = new ArrayList<>();
                      for (Iterator<String> it = lf.keys(); it.hasNext(); ) {
                          String rel = it.next();
                          if (!rf.has(rel)) gone.add(rel);
                      }
                      for (String rel : gone) { new File(contentDir, rel).delete(); lf.remove(rel); }
                      JSONObject save = new JSONObject();
                      save.put("build", fails == 0 ? remote.optInt("build") : (local != null ? local.optInt("build") : 0));
                      save.put("files", lf);
                      writeText(new File(contentDir, "version.json"), save.toString());

                      boolean canOpen = new File(contentDir, "index.html").exists();
                      if (fails > 0 && !canOpen) {
                          js("upd.fail('내려받다가 끊겼어요. 인터넷을 확인하고 앱을 다시 열어 주세요.')");
                      } else if (fails > 0) {
                          js("upd.ready(true," + q(remote.optString("notes")) + ",true)");
                      } else {
                          js("upd.ready(true," + q(remote.optString("notes")) + ",false)");
                      }
                  } catch (Exception e) {
                      boolean canOpen = new File(contentDir, "index.html").exists();
                      if (canOpen) js("upd.ready(false,'',true)");
                      else js("upd.fail(" + q("문제가 생겼어요: " + e.getMessage()) + ")");
                  } finally {
                      busy = false;
                  }
              }

              private boolean download(String url, File dst, String sha, long base, long total, String rel) {
                  File tmp = new File(dst.getPath() + ".tmp");
                  try {
                      File dir = dst.getParentFile();
                      if (dir != null) dir.mkdirs();
                      HttpURLConnection c = open(url, 10000, 60000);
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      try (InputStream in = c.getInputStream(); FileOutputStream out = new FileOutputStream(tmp)) {
                          byte[] buf = new byte[65536];
                          long got = 0, shown = 0;
                          int n;
                          while ((n = in.read(buf)) > 0) {
                              out.write(buf, 0, n);
                              md.update(buf, 0, n);
                              got += n;
                              if (got - shown > 262144) {
                                  shown = got;
                                  js("upd.progress(" + (base + got) + "," + total + "," + q(rel) + ")");
                              }
                          }
                      } finally {
                          c.disconnect();
                      }
                      if (!hex(md.digest()).equals(sha)) { tmp.delete(); return false; }
                      if (dst.exists()) dst.delete();
                      return tmp.renameTo(dst);
                  } catch (Exception e) {
                      tmp.delete();
                      return false;
                  }
              }

              private static HttpURLConnection open(String url, int connectMs, int readMs) throws Exception {
                  // GitHub 내려받기는 다른 주소로 한두 번 넘겨줘요. 직접 따라가요.
                  for (int i = 0; i < 6; i++) {
                      HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                      c.setConnectTimeout(connectMs);
                      c.setReadTimeout(readMs);
                      c.setInstanceFollowRedirects(false);
                      c.setRequestProperty("User-Agent", "hyegwang-jeongwa-app");
                      int code = c.getResponseCode();
                      if (code >= 300 && code < 400) {
                          String loc = c.getHeaderField("Location");
                          c.disconnect();
                          if (loc == null) throw new Exception("redirect");
                          url = new URL(new URL(url), loc).toString();
                          continue;
                      }
                      if (code != 200) { c.disconnect(); throw new Exception("HTTP " + code); }
                      return c;
                  }
                  throw new Exception("too many redirects");
              }

              private static byte[] get(String url, int connectMs, int readMs) throws Exception {
                  HttpURLConnection c = open(url, connectMs, readMs);
                  try (InputStream in = c.getInputStream()) {
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                      return bo.toByteArray();
                  } finally {
                      c.disconnect();
                  }
              }

              private static JSONObject readJson(File f) {
                  try (FileInputStream in = new FileInputStream(f)) {
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                      return new JSONObject(new String(bo.toByteArray(), StandardCharsets.UTF_8));
                  } catch (Exception e) {
                      return null;
                  }
              }

              private static void writeText(File f, String s) throws Exception {
                  File tmp = new File(f.getPath() + ".tmp");
                  try (FileOutputStream out = new FileOutputStream(tmp)) {
                      out.write(s.getBytes(StandardCharsets.UTF_8));
                  }
                  if (f.exists()) f.delete();
                  tmp.renameTo(f);
              }

              private static String hex(byte[] b) {
                  StringBuilder sb = new StringBuilder();
                  for (byte x : b) sb.append(String.format("%02x", x));
                  return sb.toString();
              }

              // ───────────── 카메라 권한 ─────────────

              private void handlePermission(PermissionRequest request) {
                  boolean wantsCamera = Arrays.asList(request.getResources())
                          .contains(PermissionRequest.RESOURCE_VIDEO_CAPTURE);
                  if (!wantsCamera) {
                      request.deny();
                      return;
                  }
                  if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                      request.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                  } else {
                      pendingRequest = request;
                      requestPermissions(new String[]{Manifest.permission.CAMERA}, REQ_CAMERA);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode != REQ_CAMERA || pendingRequest == null) return;
                  boolean ok = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                  if (ok) {
                      pendingRequest.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                  } else {
                      pendingRequest.deny();
                      Toast.makeText(this, "카메라를 허용해야 '움직여 봐요'를 할 수 있어요.", Toast.LENGTH_LONG).show();
                  }
                  pendingRequest = null;
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != REQ_FILE || fileCallback == null) return;
                  fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                  fileCallback = null;
              }

              // ───────────── 목소리 ─────────────

              // 목소리 소식(시작·끝·오류)을 화면(모든 틀)에 알려요.
              private void ttsEvent(String type, String id) {
                  js("window.__hgTts&&window.__hgTts(" + q(type) + "," + q(id) + ")");
              }

              private void ttsWarn() {
                  if (ttsWarned) return;
                  ttsWarned = true;
                  Toast.makeText(this, "이 기기에 한국어 목소리가 없어요. 설정 → 텍스트 음성 변환에서 한국어 음성을 받아 주세요.", Toast.LENGTH_LONG).show();
              }

              // a: [id, text, rate, pitch, volume, flush]
              private void ttsSpeakNow(String[] a) {
                  try {
                      float rate = Float.parseFloat(a[2]), pitch = Float.parseFloat(a[3]), vol = Float.parseFloat(a[4]);
                      tts.setSpeechRate(rate > 0 ? rate : 1f);
                      tts.setPitch(pitch > 0 ? pitch : 1f);
                      Bundle p = new Bundle();
                      p.putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, Math.max(0f, Math.min(1f, vol)));
                      int mode = "1".equals(a[5]) ? TextToSpeech.QUEUE_FLUSH : TextToSpeech.QUEUE_ADD;
                      if (tts.speak(a[1], mode, p, a[0]) != TextToSpeech.SUCCESS) ttsEvent("error", a[0]);
                  } catch (Exception e) {
                      ttsEvent("error", a[0]);
                  }
              }

              private class TtsBridge {
                  @JavascriptInterface
                  public boolean ready() { return ttsReady; }

                  // 0: 준비 중, 1: 됨, -1: 안 됨
                  @JavascriptInterface
                  public int state() { return ttsState; }

                  // 웹의 speechSynthesis.speak 처럼 차례대로 줄을 세워 읽어요. 시작·끝을 화면에 알려 줘요.
                  @JavascriptInterface
                  public void say(String id, String text, float rate, float pitch, float volume) {
                      String[] a = { id == null ? "" : id, text == null ? "" : text,
                              String.valueOf(rate), String.valueOf(pitch), String.valueOf(volume), "0" };
                      if (ttsState == 1) { ttsSpeakNow(a); return; }
                      if (ttsState == 0) { synchronized (ttsWaiting) { if (ttsState == 0) { ttsWaiting.add(a); return; } } }
                      if (ttsState == 1) { ttsSpeakNow(a); return; }
                      ttsEvent("error", a[0]);
                      runOnUiThread(MainActivity.this::ttsWarn);
                  }

                  // 예전 방식 (바로 끊고 읽기). 혹시 쓰는 곳이 있을까 봐 남겨 둬요.
                  @JavascriptInterface
                  public void speak(String text, float rate, float pitch, float volume) {
                      String[] a = { "hg" + System.nanoTime(), text == null ? "" : text,
                              String.valueOf(rate), String.valueOf(pitch), String.valueOf(volume), "1" };
                      if (ttsState == 1) ttsSpeakNow(a);
                  }

                  @JavascriptInterface
                  public void stop() {
                      synchronized (ttsWaiting) { ttsWaiting.clear(); }
                      if (tts != null) tts.stop();
                  }
              }

              // ───────────── 화면·버튼 ─────────────

              // 학생이 실수로 뒤로 가기를 눌러도 바로 닫히지 않게, 두 번 눌러야 닫혀요.
              private void backPressed() {
                  long now = System.currentTimeMillis();
                  if (now - lastBack < 2000) {
                      finish();
                  } else {
                      lastBack = now;
                      Toast.makeText(this, "한 번 더 누르면 앱이 닫혀요.", Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  backPressed();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              @SuppressWarnings("deprecation")
              private void hideSystemBars() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      WindowInsetsController c = getWindow().getInsetsController();
                      if (c != null) {
                          c.hide(WindowInsets.Type.systemBars());
                          c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onPause() {
                  if (tts != null) tts.stop();
                  web.onPause();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) tts.shutdown();
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          HGEOF

          mkdir -p "$(dirname 'android/app/src/main/assets/updater.html')"
